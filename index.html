<link rel="stylesheet" href="bmi.css">
<body>
<div class="box">
    <h1>Calculator</h1>
    <label>First number</label>
   <input type="number" id="number1" placeholder="Enter first number">
   <br><br>
   <label>Operator</label>
 <input type="text" id="operator" name="operator" placeholder="Enter +, -, *, /">
  <br><br>
    <label>Second number</label>
   <input type="number" id="number2" placeholder="Enter second number">
   <br><br><br>
   <button onclick="calculate()">click here to calculate</button>
   <div id="resultBox" style="margin-top:20px; font-size:20px; color:rgb(7, 7, 20);"></div>
</div>
</body>
